<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スポンサーROIシミュレーター | 株式会社高原</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#F7F8FA;color:#1A1A1A;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:#fff;border-right:1px solid #E5E7EB;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sidebar-header{padding:16px;border-bottom:1px solid #E5E7EB}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:8px;background:#1A1A1A;display:flex;align-items:center;justify-content:center}
.logo-mark i{font-size:17px;color:#F5C842}
.logo-name{font-size:13px;font-weight:700;color:#1A1A1A}
.logo-sub{font-size:10px;color:#9CA3AF;margin-top:1px}
.sidebar-body{flex:1;padding:8px 0}
.club-section{margin-bottom:2px}
.club-header{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;background:#fff;transition:background .1s}
.club-header:hover{background:#F9FAFB}
.club-icon{width:22px;height:22px;border-radius:5px;background:#FEF3C7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.club-icon i{font-size:11px;color:#D97706}
.club-name{font-size:11px;font-weight:600;color:#374151;flex:1;line-height:1.3}
.club-toggle{font-size:11px;color:#9CA3AF;transition:transform .2s}
.club-toggle.open{transform:rotate(180deg)}
.club-companies{display:none;background:#F9FAFB}
.club-companies.open{display:block}
.company-item{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 38px;cursor:pointer;transition:background .1s;border-left:3px solid transparent}
.company-item:hover{background:#F3F4F6}
.company-item.active{background:#FFFBEB;border-left-color:#F5C842}
.company-item-name{font-size:12px;color:#4B5563;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.company-item.active .company-item-name{color:#92400E;font-weight:600}
.add-btn{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 38px;cursor:pointer;font-size:11px;color:#9CA3AF;transition:color .1s}
.add-btn:hover{color:#F5C842}
.add-btn i{font-size:12px}

/* MAIN */
.main{flex:1;height:100vh;overflow-y:auto;background:#F7F8FA}
.topbar{background:#fff;border-bottom:1px solid #E5E7EB;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-left h2{font-size:15px;font-weight:700;color:#1A1A1A}
.topbar-left p{font-size:11px;color:#9CA3AF;margin-top:2px}
.topbar-badge{font-size:10px;font-weight:700;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;padding:4px 12px;border-radius:4px}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 53px);gap:14px;color:#9CA3AF}
.empty i{font-size:48px;opacity:.3}
.empty h3{font-size:17px;font-weight:700;color:#6B7280}
.empty p{font-size:13px;text-align:center;line-height:1.7}

/* CONTENT */
.content{padding:24px 28px 64px}

/* COMPANY HEAD */
.co-head{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.co-head h1{font-size:20px;font-weight:700;color:#1A1A1A;margin-bottom:6px}
.co-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#6B7280;background:#F3F4F6;border-radius:4px;padding:3px 8px}
.mtag i{font-size:11px}
.st-badge{display:inline-flex;font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px;margin-right:6px}
.issue-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.itag{font-size:11px;color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;padding:3px 8px;border-radius:4px}
.co-actions{display:flex;gap:8px;flex-shrink:0}

/* BUTTONS */
.btn{border:none;border-radius:6px;padding:8px 14px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:'Noto Sans JP',sans-serif;font-weight:500;transition:opacity .12s}
.btn:hover{opacity:.8}
.btn-primary{background:#1A1A1A;color:#fff}
.btn-outline{background:#fff;color:#374151;border:1px solid #D1D5DB}
.btn-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.btn-yellow{background:#F5C842;color:#1A1A1A}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s;position:relative}
.kpi:hover{border-color:#F5C842}
.kpi::after{content:"?";position:absolute;top:10px;right:12px;font-size:10px;color:#D1D5DB;font-weight:700}
.kpi-label{font-size:10px;font-weight:600;color:#9CA3AF;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700;color:#1A1A1A;line-height:1}
.kpi-value.yellow{color:#D97706}
.kpi-value.green{color:#059669}
.kpi-value.blue{color:#2563EB}
.kpi-value.purple{color:#7C3AED}
.kpi-sub{font-size:10px;color:#9CA3AF;margin-top:4px;line-height:1.4}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* CARD */
.card{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px 22px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;color:#374151;margin-bottom:14px;display:flex;align-items:center;gap:6px;letter-spacing:.04em}
.card-title i{font-size:14px;color:#D97706}

/* SECTION DIVIDER */
.section-label{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:6px}
.section-label::after{content:'';flex:1;height:1px;background:#E5E7EB}

/* COMPARISON */
.comp-row{display:flex;align-items:center;margin-bottom:12px}
.comp-row:last-child{margin-bottom:0}
.comp-name{font-size:12px;color:#4B5563;width:110px;flex-shrink:0}
.comp-bar-wrap{flex:1;height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden;margin:0 10px}
.comp-bar{height:100%;border-radius:4px;transition:width .8s ease}
.comp-num{font-size:12px;font-weight:600;color:#1A1A1A;width:70px;text-align:right;flex-shrink:0;cursor:pointer}
.comp-num:hover{color:#D97706;text-decoration:underline}
.comp-note{font-size:10px;color:#9CA3AF;width:80px;flex-shrink:0;text-align:right}

/* EFFECT */
.effect-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6}
.effect-item:last-child{border-bottom:none}
.effect-icon{width:28px;height:28px;border-radius:6px;background:#FFFBEB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.effect-icon i{font-size:13px;color:#D97706}
.effect-title{font-size:12px;font-weight:600;color:#1A1A1A;margin-bottom:2px}
.effect-text{font-size:11px;color:#6B7280;line-height:1.6}

/* ISSUE EFFECT */
.issue-effect{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:12px 14px;margin-bottom:8px}
.issue-effect-title{font-size:11px;font-weight:700;color:#1D4ED8;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.issue-effect-text{font-size:12px;color:#1E40AF;line-height:1.7}

/* RECOMMEND */
.recommend{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:18px 20px}
.rec-badge{font-size:9px;font-weight:700;color:#92400E;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.rec-plan{font-size:16px;font-weight:700;color:#1A1A1A;margin-bottom:6px}
.rec-desc{font-size:12px;color:#4B5563;line-height:1.7;margin-bottom:10px}
.rec-tags{display:flex;flex-wrap:wrap;gap:6px}
.rec-tag{font-size:10px;font-weight:700;color:#92400E;background:#FEF3C7;padding:3px 10px;border-radius:4px}

/* ROI SCORE */
.score-wrap{text-align:center;padding:8px 0 16px}
.score-num{font-size:52px;font-weight:700;line-height:1}
.score-label{font-size:12px;color:#6B7280;margin-top:4px}
.score-bar{height:10px;background:#F3F4F6;border-radius:5px;overflow:hidden;margin:12px 0 6px}
.score-fill{height:100%;border-radius:5px;transition:width .8s ease}
.score-marks{display:flex;justify-content:space-between;font-size:10px;color:#9CA3AF}

/* TOOLTIP MODAL */
.tip-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.tip-overlay.open{display:flex}
.tip-box{background:#fff;border-radius:12px;padding:28px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.tip-title{font-size:16px;font-weight:700;color:#1A1A1A;margin-bottom:6px}
.tip-formula{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:14px 16px;margin:12px 0;font-family:monospace;font-size:13px;color:#374151;line-height:1.8}
.tip-def{font-size:13px;color:#4B5563;line-height:1.8;margin-bottom:14px}
.tip-result{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:12px 14px;font-size:13px;color:#92400E;line-height:1.8}
.tip-close{width:100%;background:#1A1A1A;color:#fff;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px;font-family:'Noto Sans JP',sans-serif}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 24px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:15px;font-weight:700;color:#1A1A1A}
.modal-close{background:none;border:none;color:#9CA3AF;cursor:pointer;font-size:20px;padding:2px}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid #E5E7EB;display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}

/* FORM */
.fs-title{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ff{margin-bottom:10px}
.fl{font-size:11px;font-weight:600;color:#374151;margin-bottom:5px;display:block}
.fi{width:100%;background:#fff;border:1px solid #D1D5DB;border-radius:6px;padding:9px 11px;font-size:13px;color:#1A1A1A;font-family:'Noto Sans JP',sans-serif;outline:none;transition:border-color .12s}
.fi:focus{border-color:#F5C842}
.fsel{width:100%;background:#fff;border:1px solid #D1D5DB;border-radius:6px;padding:9px 11px;font-size:13px;color:#1A1A1A;font-family:'Noto Sans JP',sans-serif;outline:none;cursor:pointer;appearance:none}
.fsel:focus{border-color:#F5C842}
.fta{width:100%;background:#fff;border:1px solid #D1D5DB;border-radius:6px;padding:9px 11px;font-size:13px;color:#1A1A1A;font-family:'Noto Sans JP',sans-serif;outline:none;resize:vertical;min-height:72px}
.fta:focus{border-color:#F5C842}
.check-group{display:flex;flex-wrap:wrap;gap:7px}
.ci{display:flex;align-items:center;gap:5px;font-size:12px;color:#4B5563;cursor:pointer;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:5px;padding:5px 9px;transition:all .1s}
.ci:hover{border-color:#D1D5DB}
.ci input{accent-color:#F5C842;width:13px;height:13px}
.ci.checked{border-color:#F5C842;color:#92400E;background:#FFFBEB}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:3px}
@media print{.sidebar,.topbar,.co-actions,.modal-overlay,.tip-overlay{display:none!important}.main{height:auto;overflow:visible}.content{padding:16px}}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-mark"><i class="ti ti-basketball"></i></div>
      <div>
        <div class="logo-name">株式会社高原</div>
        <div class="logo-sub">スポンサーROIシミュレーター</div>
      </div>
    </div>
  </div>
  <div class="sidebar-body" id="sidebar-body"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="top-title">スポンサーROIシミュレーター</h2>
      <p id="top-sub">左のサイドバーから企業を選択してください</p>
    </div>
    <div class="topbar-badge">株式会社高原</div>
  </div>
  <div id="main-content">
    <div class="empty">
      <i class="ti ti-chart-bar"></i>
      <h3>企業を選択してください</h3>
      <p>左のサイドバーからクラブを選び<br>企業をタップするとROIが表示されます</p>
    </div>
  </div>
</div>
</div>

<!-- ツールチップモーダル -->
<div class="tip-overlay" id="tip-overlay" onclick="if(event.target===this)closeTip()">
  <div class="tip-box">
    <div class="tip-title" id="tip-title"></div>
    <div class="tip-def" id="tip-def"></div>
    <div class="tip-formula" id="tip-formula"></div>
    <div class="tip-result" id="tip-result"></div>
    <button class="tip-close" onclick="closeTip()">閉じる</button>
  </div>
</div>

<!-- 企業追加・編集モーダル -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">企業を追加</div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <input type="hidden" id="edit-club">

      <div class="fs-title" style="margin-bottom:10px">基本情報</div>
      <div class="fg">
        <div class="ff" style="grid-column:1/-1"><label class="fl">企業名 *</label><input class="fi" id="f-name" placeholder="株式会社○○"></div>
        <div class="ff"><label class="fl">業種 *</label>
          <select class="fsel" id="f-industry">
            <option value="realestate">不動産・建設</option>
            <option value="food">飲食・カフェ</option>
            <option value="retail">小売・ショップ</option>
            <option value="recruit">採用・HR系</option>
            <option value="lawyer">士業</option>
            <option value="beauty">美容・健康</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="ff"><label class="fl">担当者名</label><input class="fi" id="f-contact" placeholder="山田 太郎"></div>
        <div class="ff"><label class="fl">電話番号</label><input class="fi" id="f-tel" placeholder="000-0000-0000"></div>
        <div class="ff"><label class="fl">メールアドレス</label><input class="fi" id="f-email" placeholder="info@example.com"></div>
      </div>

      <div class="fs-title" style="margin-bottom:10px">財務・規模情報</div>
      <div class="fg">
        <div class="ff"><label class="fl">年間スポンサー金額（万円）*</label><input class="fi" id="f-budget" type="number" placeholder="100" min="10"></div>
        <div class="ff"><label class="fl">現在の月間広告費（万円）</label><input class="fi" id="f-adcost" type="number" placeholder="30"></div>
        <div class="ff"><label class="fl">従業員数</label>
          <select class="fsel" id="f-employees">
            <option value="">選択してください</option>
            <option value="1〜10名">1〜10名</option>
            <option value="11〜30名">11〜30名</option>
            <option value="31〜100名">31〜100名</option>
            <option value="101〜300名">101〜300名</option>
            <option value="300名以上">300名以上</option>
          </select>
        </div>
        <div class="ff"><label class="fl">年間売上規模</label>
          <select class="fsel" id="f-sales">
            <option value="">選択してください</option>
            <option value="〜1億円">〜1億円</option>
            <option value="1〜3億円">1〜3億円</option>
            <option value="3〜10億円">3〜10億円</option>
            <option value="10〜30億円">10〜30億円</option>
            <option value="30億円以上">30億円以上</option>
          </select>
        </div>
      </div>

      <div class="fs-title" style="margin-bottom:10px">課題・ニーズ</div>
      <div class="ff" style="margin-bottom:12px">
        <label class="fl">主な課題（複数選択可）</label>
        <div class="check-group" id="issues-check">
          <label class="ci"><input type="checkbox" value="集客・新規顧客">集客・新規顧客</label>
          <label class="ci"><input type="checkbox" value="採用">採用</label>
          <label class="ci"><input type="checkbox" value="地域認知">地域認知</label>
          <label class="ci"><input type="checkbox" value="ブランディング">ブランディング</label>
          <label class="ci"><input type="checkbox" value="競合差別化">競合差別化</label>
          <label class="ci"><input type="checkbox" value="SNS強化">SNS強化</label>
          <label class="ci"><input type="checkbox" value="従業員モチベ">従業員モチベ</label>
          <label class="ci"><input type="checkbox" value="CSR・社会貢献">CSR・社会貢献</label>
        </div>
      </div>
      <div class="fg" style="margin-bottom:12px">
        <div class="ff">
          <label class="fl">現在の主な広告手段</label>
          <select class="fsel" id="f-ad-method">
            <option value="">使っていない／不明</option>
            <option value="折込チラシ">折込チラシ</option>
            <option value="新聞広告">新聞広告</option>
            <option value="看板・屋外広告">看板・屋外広告</option>
            <option value="Instagram広告">Instagram広告</option>
            <option value="Facebook広告">Facebook広告</option>
            <option value="Google広告">Google広告</option>
            <option value="YouTube広告">YouTube広告</option>
            <option value="DM・ダイレクトメール">DM・ダイレクトメール</option>
            <option value="フリーペーパー">フリーペーパー</option>
            <option value="地域情報誌">地域情報誌</option>
            <option value="テレビCM">テレビCM</option>
            <option value="ラジオ広告">ラジオ広告</option>
          </select>
        </div>
        <div class="ff">
          <label class="fl">広告費（月額・万円）</label>
          <input class="fi" id="f-ad-cost" type="number" placeholder="例）15" min="0">
        </div>
        <div class="ff">
          <label class="fl">現在の主な採用手段</label>
          <select class="fsel" id="f-recruit-method">
            <option value="">使っていない／不明</option>
            <option value="Indeed">Indeed</option>
            <option value="リクナビNEXT">リクナビNEXT</option>
            <option value="マイナビ転職">マイナビ転職</option>
            <option value="doda">doda</option>
            <option value="ハローワーク">ハローワーク</option>
            <option value="求人ボックス">求人ボックス</option>
            <option value="エン転職">エン転職</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="人材紹介会社">人材紹介会社（成功報酬）</option>
            <option value="リファラル採用（紹介）">リファラル採用（紹介）</option>
            <option value="採用サイト自社運営">採用サイト自社運営</option>
            <option value="SNS採用">SNS採用</option>
            <option value="人材派遣会社">人材派遣会社</option>
          </select>
        </div>
        <div class="ff">
          <label class="fl">採用費（月額・万円）</label>
          <input class="fi" id="f-recruit-cost" type="number" placeholder="例）30" min="0">

// ====== ROI計算 ======
function calcROI(clubKey, c){
  const club = CLUBS[clubKey];
  const budget = parseInt(c.budget)||0;
  const budgetYen = budget * 10000;

  // 観客リーチ
  const homeReach = club.homeGames * club.homeAudience;
  const awayReach = Math.round(club.awayGames * club.homeAudience * club.awayRatio);
  const audienceReach = homeReach + awayReach;

  // SNSリーチ（フォロワー数＝ユニーク上限）
  const snsReach = club.snsFol;

  // ユニークリーチ（重複10%除外）
  const overlap = Math.round((audienceReach + snsReach) * 0.1);
  const uniqueReach = audienceReach + snsReach - overlap;

  // SNS累積インプレッション（フォロワー数×投稿数×リーチ率15%）
  const snsImpressions = Math.round(club.snsFol * club.snsPost * 0.15);

  // 1人あたりコスト
  const cpa = budget > 0 ? Math.round(budgetYen / uniqueReach) : 0;
  const monthly = Math.round(budget / 12 * 10) / 10;

  // 投資効果スコア（継続接触回数ベース：スポンサーが最も優位な軸）
  const ind = INDUSTRIES[c.industry]||INDUSTRIES.other;
  const totalContacts = club.homeGames + club.awayGames + club.snsPost;
  const roiScore = Math.min(100, Math.round(Math.log(totalContacts+1) / Math.log(250+1) * 100));

  // 競合比較（ユニークリーチ参考値）
  const flyerUnique = Math.round(budgetYen / 5);
  const snsAdUnique = Math.round(budgetYen / 1.5 / 3);
  const recruitUnique = Math.round(budgetYen / 120 / 0.03);

  // CPA比較（1人に届けるコスト）
  const flyerCPA = 5;          // 折込チラシ：1枚5円だが1回限り
  const snsAdCPA = Math.round(budgetYen / snsAdUnique);  // SNS広告CPA
  const recruitCPA = Math.round(budgetYen / recruitUnique); // 求人広告CPA
  const maxCPA = Math.max(cpa, flyerCPA, snsAdCPA, recruitCPA, 1);

  return { homeReach, awayReach, audienceReach, snsReach, overlap, uniqueReach,
           snsImpressions, cpa, monthly, roiScore, budgetYen, totalContacts,
           flyerUnique, snsAdUnique, recruitUnique,
           flyerCPA, snsAdCPA, recruitCPA, maxCPA,
           budget, club, ind };
}

function fmt(n){
  if(n>=10000) return (n/10000).toFixed(1)+'万';
  if(n>=1000) return (n/1000).toFixed(1)+'千';
  return Math.round(n).toLocaleString();
}

function buildAdCompare(c, calc){
  if(!c.adMethod && !c.recruitMethod) return '';
  const rows = [
    {key:'adMethod',costKey:'adCostInput',label:'広告手段'},
    {key:'recruitMethod',costKey:'recruitCostInput',label:'採用手段'}
  ];
  let html = '<div class="card"><div class="card-title"><i class="ti ti-ad"></i>現在の広告・採用投資 vs スポンサー比較</div>';
  rows.forEach(({key,costKey,label})=>{
    const method = c[key];
    if(!method) return;
    const data = AD_COSTS[method];
    const monthlyInput = parseInt(c[costKey])||0;
    // 人材紹介会社は成果報酬なので月額換算しない
    const isSuccessFee = method === '人材紹介会社';
    const monthly = monthlyInput > 0 ? monthlyInput : (data ? data.monthly : 0);
    const annualCost = isSuccessFee && monthlyInput > 0 ? monthlyInput : monthly * 12;
    const sponsorAnnual = calc.budget;
    const diff = Math.abs(annualCost - sponsorAnnual);
    const isCheaper = annualCost > sponsorAnnual;
    const reach = data ? data.reach : 0;
    const unit = data ? data.unit : '';
    const ratio = reach > 0 ? Math.round(calc.uniqueReach/(reach*12)*10)/10 : 0;
    const resultMsg = annualCost === 0
      ? '💡 月額費用を入力すると比較できます'
      : isCheaper
        ? '✅ スポンサーに切り替えると年間'+diff+'万円コスト削減＋継続露出が得られます'
        : annualCost === sponsorAnnual
          ? '✅ 現在と同額でスポンサーの継続露出・ブランド価値が得られます'
          : '💡 年間'+diff+'万円の追加投資で'+calc.uniqueReach.toLocaleString()+'人への年間継続露出が得られます';
    const resultStyle = isCheaper
      ? 'background:#F0FDF4;color:#065F46'
      : 'background:#FFF7ED;color:#92400E';
    html += '<div style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:14px 16px;margin-bottom:12px">'
      +'<div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:10px">'+label+'：'+method+(isSuccessFee&&monthlyInput>0?' ／ 成果報酬'+monthlyInput+'万円（入力値）':monthlyInput>0?' ／ 月'+monthlyInput+'万円（入力値）':monthly>0?' ／ 月'+monthly+'万円（目安）':'')+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'
        +'<div style="background:#fff;border:1px solid #E5E7EB;border-radius:6px;padding:10px;text-align:center">'
          +'<div style="font-size:10px;color:#9CA3AF;margin-bottom:4px">現在の年間コスト</div>'
          +'<div style="font-size:18px;font-weight:700;color:#1A1A1A">'+(annualCost>0?annualCost+'万円':'未入力')+'</div>'
          +'<div style="font-size:10px;color:#9CA3AF">'+(isSuccessFee&&monthlyInput>0?'成果報酬（入力値）':monthly>0?'月'+monthly+'万円×12':'金額を入力してください')+'</div>'
        +'</div>'
        +'<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:10px;text-align:center">'
          +'<div style="font-size:10px;color:#92400E;margin-bottom:4px">スポンサー年間費用</div>'
          +'<div style="font-size:18px;font-weight:700;color:#D97706">'+sponsorAnnual+'万円</div>'
          +'<div style="font-size:10px;color:#92400E">月'+calc.monthly+'万円×12</div>'
        +'</div>'
      +'</div>'
      +'<div style="font-size:11px;color:#4B5563;line-height:1.7;margin-bottom:8px">'
        +(isSuccessFee
          ? '現在：'+method+'は採用が決まった時だけコスト発生。ブランド認知は一切積み上がらない。<br>'
          : reach>0?'現在：'+method+'（月約'+reach.toLocaleString()+'人）は<strong style="color:#DC2626">単発リーチ</strong>。配布・掲載が終われば即ゼロ。<br>':'')
        +'スポンサー：<strong style="color:#D97706">'+calc.uniqueReach.toLocaleString()+'人に年間'+(calc.club.homeGames+calc.club.awayGames+calc.club.snsPost)+'回</strong>届き続ける。契約期間中は消えない。<br>'
        +'"広告"ではなく「応援している会社」として自然に記憶に残る。'
      +'</div>'
      +'<div style="padding:8px 12px;border-radius:6px;font-size:12px;font-weight:600;'+resultStyle+'">'+resultMsg+'</div>'
    +'</div>';
  });
  html += '</div>';
  return html;
}

          ${c.sales?`<span class="mtag"><i class="ti ti-chart-bar"></i>${c.sales}</span>`:''}
          ${c.referral?`<span class="mtag"><i class="ti ti-arrow-right"></i>紹介：${c.referral}</span>`:''}
        </div>
        ${issues.length>0?`<div class="issue-tags">${issues.map(i=>`<span class="itag">${i}</span>`).join('')}</div>`:''}
      </div>
      <div class="co-actions">
        <button class="btn btn-outline" onclick="openModal('${clubKey}','${id}')"><i class="ti ti-edit"></i>編集</button>
        <button class="btn btn-danger" onclick="deleteCompany('${clubKey}','${id}')"><i class="ti ti-trash"></i>削除</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="ti ti-printer"></i>印刷</button>
      </div>
    </div>

    <!-- KPI（タップで計算式表示） -->
    <div class="kpi-grid">
      <div class="kpi" onclick="showTip('uniqueReach',lastCalc)" title="タップで計算式を確認">
        <div class="kpi-label">年間ユニークリーチ</div>
        <div class="kpi-value yellow">${fmt(calc.uniqueReach)}人</div>
        <div class="kpi-sub">観客${fmt(calc.audienceReach)}人＋SNS${fmt(calc.snsReach)}人（重複除外済）</div>
      </div>
      <div class="kpi" onclick="showTip('exposures',lastCalc)" title="タップで詳細確認">
        <div class="kpi-label">年間継続接触回数</div>
        <div class="kpi-value green">${calc.club.homeGames+calc.club.awayGames+calc.club.snsPost}回</div>
        <div class="kpi-sub">試合${calc.club.homeGames+calc.club.awayGames}回＋SNS${calc.club.snsPost}回　チラシは1回で終わり</div>
      </div>
      <div class="kpi" onclick="showTip('monthly',lastCalc)" title="タップで詳細確認">
        <div class="kpi-label">月額換算コスト</div>
        <div class="kpi-value blue">${calc.monthly}万円</div>
        <div class="kpi-sub">年間${calc.budget}万円÷12ヶ月　継続露出が続く</div>
      </div>
      <div class="kpi" onclick="showTip('snsImpressions',lastCalc)" title="タップで計算式を確認">
        <div class="kpi-label">SNS累積インプレッション</div>
        <div class="kpi-value purple">${fmt(calc.snsImpressions)}回</div>
        <div class="kpi-sub">フォロワー${fmt(calc.snsReach)}人×${calc.club.snsPost}投稿×15%</div>
      </div>
    </div>

    <div class="grid2">
      <!-- ROIスコア -->
      <div class="card">
        <div class="card-title"><i class="ti ti-chart-pie"></i>継続露出スコア</div>
        <div class="score-wrap">
          <div class="score-num" style="color:${calc.roiScore>=70?'#059669':calc.roiScore>=50?'#D97706':'#DC2626'}">${calc.roiScore}<span style="font-size:22px">pt</span></div>
          <div class="score-label">${calc.roiScore>=80?'🔥 継続露出が非常に充実しています':calc.roiScore>=60?'✅ 継続露出として良好です':calc.roiScore>=40?'💬 標準的な継続露出です':'⚠️ クラブの試合数が少ないシーズンです'}</div>
        </div>
        <div style="margin:10px 0 6px;font-size:11px;color:#6B7280;line-height:1.8">
          年間継続接触回数：<strong style="color:#059669">${calc.totalContacts}回</strong><br>
          折込チラシ：1回　SNS広告：3〜5回<br>
          <strong>スポンサーは${calc.totalContacts}倍の接触機会があります</strong>
        </div>
        <div class="score-bar"><div class="score-fill" style="width:${calc.roiScore}%;background:${calc.roiScore>=70?'#059669':calc.roiScore>=50?'#F5C842':'#DC2626'}"></div></div>
        <div class="score-marks"><span>0</span><span>50</span><span>100</span></div>
        ${c.adcost&&parseInt(c.adcost)>0?`<div style="margin-top:14px;padding:10px 12px;background:#F0FDF4;border-radius:8px;font-size:12px;color:#065F46;line-height:1.8">
          現在の月間広告費 ${c.adcost}万円 × 12ヶ月 = 年間${parseInt(c.adcost)*12}万円<br>
          スポンサー年間費用 = ${calc.budget}万円<br>
          差額 = ${Math.abs(parseInt(c.adcost)*12 - calc.budget)}万円<br>
          ${parseInt(c.adcost)*12 > calc.budget
            ? `→ <strong>年間${parseInt(c.adcost)*12 - calc.budget}万円のコスト削減</strong>で、より広い継続露出が得られます`
            : parseInt(c.adcost)*12 === calc.budget
            ? `→ 現在の広告費と<strong>同額</strong>で、継続露出・ブランド価値・SNS掲載に切り替えられます`
            : `→ 現在の広告費より年間<strong>${calc.budget - parseInt(c.adcost)*12}万円多い投資</strong>になりますが、継続露出・ブランド価値・SNS掲載がセットでつきます`}
        </div>`:''}
      </div>

      <!-- 継続接触回数×信頼度 2軸比較 -->
      <div class="card">
        <div class="card-title"><i class="ti ti-chart-bar"></i>広告手法の比較</div>

        <!-- 軸①：継続接触回数 -->
        <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:8px;display:flex;align-items:center;gap:5px">
          <span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:4px;font-size:10px">軸① 継続接触回数</span>
          <span style="font-size:10px;color:#9CA3AF">同じ人に年間何回届くか（多いほど良い）</span>
        </div>
        <div class="comp-row">
          <div class="comp-name" style="color:#D97706;font-weight:600">本スポンサー</div>
          <div class="comp-bar-wrap"><div class="comp-bar" style="width:100%;background:#F5C842"></div></div>
          <div class="comp-num" style="color:#D97706;font-weight:700;cursor:pointer" onclick="showTip('exposures',lastCalc)">${calc.club.homeGames+calc.club.awayGames+calc.club.snsPost}回/年</div>
        </div>
        <div class="comp-row">
          <div class="comp-name">SNS広告</div>
          <div class="comp-bar-wrap"><div class="comp-bar" style="width:${Math.min(3/(calc.club.homeGames+calc.club.awayGames+calc.club.snsPost)*100,100)}%;background:#9CA3AF"></div></div>
          <div class="comp-num">3〜5回/年</div>
        </div>
        <div class="comp-row">
          <div class="comp-name">折込チラシ</div>
          <div class="comp-bar-wrap"><div class="comp-bar" style="width:${1/(calc.club.homeGames+calc.club.awayGames+calc.club.snsPost)*100}%;background:#9CA3AF"></div></div>
          <div class="comp-num">1回のみ</div>
        </div>
        <div class="comp-row" style="margin-bottom:16px">
          <div class="comp-name">求人広告</div>
          <div class="comp-bar-wrap"><div class="comp-bar" style="width:${1/(calc.club.homeGames+calc.club.awayGames+calc.club.snsPost)*100}%;background:#9CA3AF"></div></div>
          <div class="comp-num">1〜2回のみ</div>
        </div>

        <!-- 軸②：信頼度・ブランド効果 -->
        <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:8px;display:flex;align-items:center;gap:5px">
          <span style="background:#DBEAFE;color:#1E40AF;padding:2px 8px;border-radius:4px;font-size:10px">軸② 信頼度・ブランド効果</span>
          <span style="font-size:10px;color:#9CA3AF">受け取り側の心理的な印象</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px">
            <div style="font-size:11px;font-weight:700;color:#92400E;margin-bottom:4px">🏆 本スポンサー</div>
            <div style="font-size:11px;color:#78350F;line-height:1.6">「応援している会社」として自然に認知される。広告と気づかれず、ブランドへの好意が生まれる。</div>
          </div>
          <div style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px">
            <div style="font-size:11px;font-weight:700;color:#6B7280;margin-bottom:4px">その他の広告</div>
            <div style="font-size:11px;color:#6B7280;line-height:1.6">「広告」として認識される。スキップ・無視されやすく、信頼感の積み上げが難しい。</div>
          </div>
        </div>

        <div style="padding:10px 12px;background:#F0FDF4;border-radius:8px;font-size:11px;color:#065F46;line-height:1.8">
          ✅ スポンサーは<strong>年間${calc.club.homeGames+calc.club.awayGames+calc.club.snsPost}回</strong>同じ人に届き続けます<br>
          折込チラシは翌日捨てられ、SNS広告はスキップされます<br>
          スポンサーは「応援している会社」として記憶に残ります<br>
          <span style="color:#9CA3AF;font-size:10px">※接触回数タップで計算根拠を確認できます</span>
        </div>
      </div>
    </div>

    <div class="grid2">
      <!-- 業種別効果 -->
      <div class="card">
        <div class="card-title"><i class="ti ti-bulb"></i>${ind.name}への期待効果</div>
        ${ind.effects.map(e=>`
          <div class="effect-item">
            <div class="effect-icon"><i class="ti ${e.icon}"></i></div>
            <div><div class="effect-title">${e.title}</div><div class="effect-text">${e.text}</div></div>
          </div>`).join('')}
      </div>

      <!-- おすすめプラン＋フォロー -->
      <div>
        <div class="recommend" style="margin-bottom:14px">
          <div class="rec-badge">おすすめプラン</div>
          <div class="rec-plan">${ind.plan}</div>
          <div class="rec-desc">${ind.planDesc}</div>
          <div class="rec-tags">${ind.tags.map(t=>`<span class="rec-tag">${t}</span>`).join('')}</div>
        </div>
        ${c.followup?`<div class="card" style="margin-bottom:0">
          <div class="card-title" style="margin-bottom:8px"><i class="ti ti-calendar" style="color:#2563EB"></i>次回フォロー</div>
          <div style="font-size:18px;font-weight:700;color:#2563EB">${c.followup}</div>
        </div>`:''}
      </div>
    </div>

    ${c.memo?`<div class="card"><div class="card-title"><i class="ti ti-notes"></i>商談メモ</div><div style="font-size:13px;color:#4B5563;line-height:1.8;white-space:pre-wrap">${c.memo}</div></div>`:''}
    ${buildAdCompare(c, calc)}

    <!-- 課題別ステップ図 -->
    <div class="section-label"><i class="ti ti-layout-list" style="color:#D97706"></i>課題への解決プロセス</div>
    ${buildStepFigures(issues, ind, calc)}

    <!-- データの注記 -->
    <div style="margin-top:16px;padding:14px 16px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;font-size:11px;color:#9CA3AF;line-height:1.8">
      <strong style="color:#6B7280">【データの根拠】</strong><br>
      ${calc.club.note}<br>
      SNS投稿数は週4回×52週＝208回/年で推計（実績確認後に更新予定）。<br>
      競合広告比較は公開データに基づく推計値です。実際の効果は媒体・時期により異なります。<br>
      全ての数値は参考値です。実データが揃い次第更新します。
    </div>
  </div>`;
}

// ====== モーダル ======
function openModal(clubKey, id=null){
  document.getElementById('modal-title').textContent = id?'企業情報を編集':'企業を追加';
  document.getElementById('edit-club').value = clubKey;
  document.getElementById('edit-id').value = id||'';
  ['f-name','f-contact','f-tel','f-email','f-budget','f-adcost','f-memo','f-start','f-followup','f-referral'].forEach(k=>{const el=document.getElementById(k);if(el)el.value='';})
  document.getElementById('f-ad-method').value='';
  document.getElementById('f-ad-cost').value='';
  document.getElementById('f-recruit-method').value='';
  document.getElementById('f-recruit-cost').value='';;
  ['f-industry','f-employees','f-sales','f-plan','f-status','f-enthusiasm'].forEach(k=>{
    const el=document.getElementById(k);
    if(el) el.value=k==='f-industry'?'realestate':k==='f-status'?'prospecting':k==='f-enthusiasm'?'high':'';
  });
  document.querySelectorAll('#issues-check input').forEach(cb=>{cb.checked=false;cb.closest('.ci').classList.remove('checked');});
  if(id){
    const c=companies[clubKey]?.[id];
    if(c){
      const map={'f-name':'name','f-contact':'contact','f-tel':'tel','f-email':'email','f-budget':'budget','f-adcost':'adcost','f-memo':'memo','f-start':'start','f-followup':'followup','f-referral':'referral'};
      if(c.adMethod){document.getElementById('f-ad-method').value=c.adMethod;}
      if(c.adCostInput){document.getElementById('f-ad-cost').value=c.adCostInput;}
      if(c.recruitMethod){document.getElementById('f-recruit-method').value=c.recruitMethod;}
      if(c.recruitCostInput){document.getElementById('f-recruit-cost').value=c.recruitCostInput;}
      Object.entries(map).forEach(([fid,key])=>{const el=document.getElementById(fid);if(el&&c[key])el.value=c[key];});
      ['f-industry','f-employees','f-sales','f-plan','f-status','f-enthusiasm'].forEach(k=>{
        const key=k.replace('f-','').replace('-','');
        const el=document.getElementById(k);
        const val=c[key]||c[k.replace('f-','')]||'';
        if(el&&val)el.value=val;
      });
      if(Array.isArray(c.issues)){
        document.querySelectorAll('#issues-check input').forEach(cb=>{
          if(c.issues.includes(cb.value)){cb.checked=true;cb.closest('.ci').classList.add('checked');}
        });
      }
    }
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function saveCompany(){
  const clubKey=document.getElementById('edit-club').value;
  const id=document.getElementById('edit-id').value||Date.now().toString();
  const name=document.getElementById('f-name').value.trim();
  const budget=document.getElementById('f-budget').value;
  if(!name){alert('企業名を入力してください');return;}
  if(!budget){alert('スポンサー金額を入力してください');return;}
  const issues=[];
  document.querySelectorAll('#issues-check input:checked').forEach(cb=>issues.push(cb.value));
  const data={
    name,industry:document.getElementById('f-industry').value,
    contact:document.getElementById('f-contact').value,tel:document.getElementById('f-tel').value,
    email:document.getElementById('f-email').value,budget:parseInt(budget),
    adcost:parseInt(document.getElementById('f-adcost').value)||0,
    employees:document.getElementById('f-employees').value,sales:document.getElementById('f-sales').value,
    adMethod:document.getElementById('f-ad-method').value,
    adCostInput:parseInt(document.getElementById('f-ad-cost').value)||0,
    recruitMethod:document.getElementById('f-recruit-method').value,
    recruitCostInput:parseInt(document.getElementById('f-recruit-cost').value)||0,
    issues,
    memo:document.getElementById('f-memo').value,
    plan:document.getElementById('f-plan').value,status:document.getElementById('f-status').value,
    start:document.getElementById('f-start').value,followup:document.getElementById('f-followup').value,
    enthusiasm:document.getElementById('f-enthusiasm').value,referral:document.getElementById('f-referral').value,
    clubKey,updatedAt:new Date().toISOString()
  };
  db.ref(`${ROOT}/companies/${clubKey}/${id}`).set(data);
  closeModal();
  currentClub=clubKey;currentCompanyId=id;
}

function deleteCompany(clubKey,id){
  if(!confirm('この企業を削除しますか？'))return;
  db.ref(`${ROOT}/companies/${clubKey}/${id}`).remove();
  currentCompanyId=null;
  document.getElementById('main-content').innerHTML='<div class="empty"><i class="ti ti-chart-bar"></i><h3>企業を選択してください</h3><p>左のサイドバーからクラブを選び<br>企業をタップするとROIが表示されます</p></div>';
  document.getElementById('top-title').textContent='スポンサーROIシミュレーター';
  document.getElementById('top-sub').textContent='左のサイドバーから企業を選択してください';
}

document.querySelectorAll('#issues-check input').forEach(cb=>{
  cb.addEventListener('change',()=>cb.closest('.ci').classList.toggle('checked',cb.checked));
});
</script>
</body>
