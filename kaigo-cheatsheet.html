<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>施設タイプ別 判断軸チートシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEEBE1;
    --panel: #FBFAF6;
    --ink: #1C2420;
    --ink-soft: #5B6259;
    --line: #D9D4C4;
    --sidebar: #172420;
    --sidebar-line: #2B3B34;
    --sidebar-text: #E9E4D4;
    --sidebar-text-dim: #9BA69B;
    --teal: #2E6F5C;
    --teal-soft: #E4EFE9;
    --good: #3D7A4E;
    --good-soft: #E7F1E4;
    --ng: #A6412A;
    --ng-soft: #F5E7E1;
    --info: #3D5A80;
    --info-soft: #E4E9F1;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar{
    padding: 30px 32px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }

  .topbar .eyebrow{
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--teal);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .topbar h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 26px;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }

  .topbar p{
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 640px;
  }

  .layout{
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 300px;
    flex-shrink: 0;
    background: var(--sidebar);
    color: var(--sidebar-text);
    padding: 18px 0 40px;
    overflow-y: auto;
  }

  .sidebar-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--sidebar-text-dim);
    padding: 6px 24px 12px;
  }

  .facility-item{
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--sidebar-text);
    padding: 14px 22px 14px 21px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 1px solid var(--sidebar-line);
  }

  .facility-item:hover{ background: rgba(255,255,255,0.03); }

  .facility-item.active{
    background: rgba(255,255,255,0.06);
    border-left-color: #C7A24A;
  }

  .facility-item .fname{
    font-family: "Shippori Mincho", serif;
    font-size: 15.5px;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }

  .facility-item .ftag{
    font-size: 11.5px;
    color: var(--sidebar-text-dim);
    line-height: 1.5;
    display: block;
  }

  /* ---------- Detail panel ---------- */
  .detail{
    flex: 1;
    overflow-y: auto;
    padding: 34px 40px 80px;
    background: var(--panel);
  }

  .detail-head{
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }

  .back-btn{
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--teal);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 0;
    margin-bottom: 18px;
    cursor: pointer;
  }

  .detail-head h2{
    font-family: "Shippori Mincho", serif;
    font-size: 27px;
    font-weight: 800;
    margin: 0 0 10px;
  }

  .detail-head .tagline{
    font-size: 13.5px;
    color: var(--teal);
    font-weight: 700;
    background: var(--teal-soft);
    display: inline-block;
    padding: 5px 12px;
    border-radius: var(--radius);
  }

  /* ---------- Accordion ---------- */
  .accordion{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    background: #fff;
    overflow: hidden;
  }

  .accordion-head{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }

  .accordion-icon{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .accordion[data-type="work"] .accordion-icon{ background: var(--teal-soft); color: var(--teal); }
  .accordion[data-type="good"] .accordion-icon{ background: var(--good-soft); color: var(--good); }
  .accordion[data-type="ng"] .accordion-icon{ background: var(--ng-soft); color: var(--ng); }
  .accordion[data-type="info"] .accordion-icon{ background: var(--info-soft); color: var(--info); }

  .accordion-title{
    flex: 1;
  }

  .accordion-title .t-main{
    font-weight: 900;
    font-size: 15.5px;
    display: block;
  }

  .accordion-title .t-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    display: block;
    margin-top: 2px;
    line-height: 1.5;
  }

  .chevron{
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    transition: transform 0.22s ease;
    color: var(--ink-soft);
  }

  .accordion.open .chevron{ transform: rotate(180deg); }

  .accordion-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }

  .accordion-body-inner{
    padding: 4px 18px 20px 60px;
    font-size: 13.5px;
    line-height: 1.85;
  }

  .accordion-body-inner p{ margin: 0 0 12px; color: var(--ink); }

  .fact-row{
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px dashed var(--line);
    font-size: 13px;
  }
  .fact-row:first-of-type{ border-top: none; }
  .fact-row .fk{
    width: 92px;
    flex-shrink: 0;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .fact-row .fv{ color: var(--ink); }

  ul.detail-list{
    margin: 10px 0 0;
    padding: 0;
    list-style: none;
  }
  ul.detail-list li{
    position: relative;
    padding-left: 18px;
    margin-bottom: 8px;
    color: var(--ink);
  }
  ul.detail-list li::before{
    content: "";
    position: absolute;
    left: 2px;
    top: 9px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
  }
  .accordion[data-type="work"] ul.detail-list li::before{ color: var(--teal); }
  .accordion[data-type="good"] ul.detail-list li::before{ color: var(--good); }
  .accordion[data-type="ng"] ul.detail-list li::before{ color: var(--ng); }
  .accordion[data-type="info"] ul.detail-list li::before{ color: var(--info); }

  /* ---------- Responsive ---------- */
  @media (max-width: 880px){
    .topbar{ padding: 22px 20px 18px; }
    .topbar h1{ font-size: 21px; }
    .sidebar{ width: 100%; }
    .layout{ position: relative; }
    .detail{
      position: fixed;
      inset: 0;
      top: 0;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 30;
      padding: 20px 20px 60px;
    }
    .detail.active{ transform: translateX(0); }
    .back-btn{ display: inline-flex; }
    .accordion-body-inner{ padding-left: 18px; }
  }

  @media (min-width: 881px){
    .layout .sidebar{ display: block; }
  }
</style>
</head>

};

const sidebarList = document.getElementById('sidebarList');
const detailContent = document.getElementById('detailContent');
const detailPanel = document.getElementById('detail');
const backBtn = document.getElementById('backBtn');

let activeId = null;

function renderSidebar(){
  sidebarList.innerHTML = FACILITIES.map(f => `
    <button class="facility-item${f.id === activeId ? ' active' : ''}" data-id="${f.id}">
      <span class="fname">${f.name}</span>
      <span class="ftag">${f.tagline}</span>
    </button>
  `).join('');

  sidebarList.querySelectorAll('.facility-item').forEach(btn => {
    btn.addEventListener('click', () => selectFacility(btn.dataset.id));
  });
}

function accordionBlock(type, label, icon, f){
  const d = f[type];
  let inner = `<p>${d.summary || d.overview}</p>`;

  if(type === 'info'){
    inner += `
      <div class="fact-row"><span class="fk">運営母体</span><span class="fv">${d.operator}</span></div>
      <div class="fact-row"><span class="fk">施設規模</span><span class="fv">${d.scale}</span></div>
      <div class="fact-row"><span class="fk">利用者像</span><span class="fv">${d.users}</span></div>
      <div class="fact-row"><span class="fk">傾向</span><span class="fv">${d.trend}</span></div>
    `;
  }

  if(type === 'good'){
    inner += `
      <div class="fact-row"><span class="fk">想定年収</span><span class="fv">${d.income}</span></div>
      <div class="fact-row"><span class="fk">入社条件</span><span class="fv">${d.requirements}</span></div>
      <div class="fact-row"><span class="fk">労働条件</span><span class="fv">${d.conditions}</span></div>
    `;
  }

  if(d.bullets){
    inner += `<ul class="detail-list">${d.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;
  }

  const subText = (d.summary || d.overview);

  return `
    <div class="accordion" data-type="${type}">
      <button class="accordion-head">
        <span class="accordion-icon">${icon}</span>
        <span class="accordion-title">
          <span class="t-main">${label}</span>
          <span class="t-sub">${subText.length > 34 ? subText.slice(0, 34) + '…' : subText}</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="accordion-body">
        <div class="accordion-body-inner">${inner}</div>
      </div>
    </div>
  `;
}

function renderDetail(f){
  detailContent.innerHTML = `
    <div class="detail-head">
      <h2>${f.name}</h2>
      <div class="tagline">向いている人：${f.tagline}</div>
    </div>
    ${accordionBlock('info', '施設の特徴', ICONS.info, f)}
    ${accordionBlock('work', '働き方', ICONS.work, f)}
    ${accordionBlock('good', 'GOODペルソナ', ICONS.good, f)}
    ${accordionBlock('ng', 'NGペルソナ', ICONS.ng, f)}
  `;

  detailContent.querySelectorAll('.accordion-head').forEach(head => {
    head.addEventListener('click', () => {
      const acc = head.closest('.accordion');
      const body = acc.querySelector('.accordion-body');
      const isOpen = acc.classList.contains('open');
      if(isOpen){
        body.style.maxHeight = '0px';
        acc.classList.remove('open');
      } else {
        acc.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    });
  });

  // open the "施設の特徴" section by default
  const first = detailContent.querySelector('.accordion[data-type="info"]');
  if(first){
    first.classList.add('open');
    const body = first.querySelector('.accordion-body');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function selectFacility(id){
  activeId = id;
  const f = FACILITIES.find(x => x.id === id);
  renderSidebar();
  renderDetail(f);
  detailPanel.classList.add('active');
  detailPanel.scrollTop = 0;
}

backBtn.addEventListener('click', () => {
  detailPanel.classList.remove('active');
});

renderSidebar();
selectFacility(FACILITIES[0].id);
if(window.innerWidth <= 880){
  detailPanel.classList.remove('active');
}
